name: Build APK

# Every merge into master produces a downloadable, installable APK.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Becomes the APK's versionCode, so each build installs over the last
      # rather than being rejected as a downgrade.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :core:test

      # Signing is optional, but the release build runs either way.
      #
      # R8 only runs on the release build, and a shrinker breaking something
      # reflective is the classic way a release APK crashes on a path no test
      # covers. Building it on every run — with a throwaway key when no real
      # one is configured — means that breakage surfaces here rather than the
      # first time somebody sets up signing.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "Using the configured signing key."
          else
            password="$(openssl rand -base64 24)"
            # Masked before it is written anywhere it could be echoed.
            echo "::add-mask::$password"
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/release.jks" -alias ci \
              -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$password" -keypass "$password" \
              -dname "CN=Doc Viewer CI, OU=CI, O=Doc Viewer, C=GB" 2>/dev/null
            echo "EPHEMERAL_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set; building the release APK with a throwaway key."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || env.EPHEMERAL_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'ci' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || env.EPHEMERAL_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Collect artifacts
        id: collect
        env:
          REAL_KEY: ${{ steps.signing.outputs.real }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist preview

          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          cp "$debug_apk" "dist/docviewer-${version}-build${BUILD_NUMBER}-debug.apk"

          if [ "$REAL_KEY" = "true" ]; then
            cp "$release_apk" "dist/docviewer-${version}-build${BUILD_NUMBER}.apk"
          else
            # Signed with a throwaway key, so it must not be published as if it
            # were a real build. It goes to the workflow artifacts instead, as
            # evidence that R8 works and as a preview of the size.
            cp "$release_apk" "preview/docviewer-${version}-build${BUILD_NUMBER}-minified-preview.apk"
          fi

          size_of() { du -m "$1" | cut -f1; }
          {
            echo "### APK sizes"
            echo
            echo "| Build | Size |"
            echo "| --- | --- |"
            echo "| debug | $(size_of "$debug_apk") MB |"
            echo "| release (R8) | $(size_of "$release_apk") MB |"
            echo
            if [ "$REAL_KEY" != "true" ]; then
              echo "The release APK was signed with a throwaway key, so it is"
              echo "attached to this run rather than to the release. Configure"
              echo "the signing secrets to publish it properly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          tag="build-${BUILD_NUMBER}"

          {
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "### Install"
            echo
            echo "Download the \`.apk\` below onto an Android phone and open it."
            echo "Android will ask you to allow installing from this source the"
            echo "first time. Requires Android 9 (API 28) or newer."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "\`docviewer-${VERSION}-build${BUILD_NUMBER}.apk\` is the signed,"
              echo "R8-shrunk release build — install that one. The \`-debug\` build"
              echo "is also attached for troubleshooting."
            else
              echo "> **This is a debug build.** It is signed with a throwaway key"
              echo "> that changes between CI runs, so installing a newer build over"
              echo "> an older one fails with a signature mismatch — uninstall the"
              echo "> previous version first. Adding the signing secrets described"
              echo "> in the README removes this."
            fi
            echo
            echo "### What is in this build"
            echo
            git log -1 --pretty=format:'%s%n%n%b' "${GITHUB_SHA}" || true
          } > release-notes.md

          gh release create "$tag" dist/*.apk \
            --title "Build ${BUILD_NUMBER} (v${VERSION})" \
            --notes-file release-notes.md

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ env.BUILD_NUMBER }}
          path: dist/*.apk
          retention-days: 30

      # Only present while signing is unconfigured; see "Collect artifacts".
      - name: Upload the minified preview build
        if: steps.signing.outputs.real != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-minified-preview-${{ env.BUILD_NUMBER }}
          path: preview/*.apk
          retention-days: 14
