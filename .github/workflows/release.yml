name: Build APK

# Every merge into master produces a downloadable, installable APK.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Becomes the APK's versionCode, so each build installs over the last
      # rather than being rejected as a downgrade.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :core:test

      # Signing is optional. Without the secrets the workflow still publishes a
      # debug APK, which installs fine — see the README for the trade-off.
      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore decoded; a signed release APK will be built."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured; publishing the debug APK only."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/docviewer-${version}-build${BUILD_NUMBER}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/docviewer-${version}-build${BUILD_NUMBER}.apk"
          fi
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          tag="build-${BUILD_NUMBER}"

          {
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "### Install"
            echo
            echo "Download the \`.apk\` below onto an Android phone and open it."
            echo "Android will ask you to allow installing from this source the"
            echo "first time. Requires Android 9 (API 28) or newer."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "\`docviewer-${VERSION}-build${BUILD_NUMBER}.apk\` is the signed"
              echo "release build. The \`-debug\` build is also attached for"
              echo "troubleshooting."
            else
              echo "> **This is a debug build.** It is signed with a throwaway key"
              echo "> that changes between CI runs, so installing a newer build over"
              echo "> an older one fails with a signature mismatch — uninstall the"
              echo "> previous version first. Adding the signing secrets described"
              echo "> in the README removes this."
            fi
            echo
            echo "### What is in this build"
            echo
            git log -1 --pretty=format:'%s%n%n%b' "${GITHUB_SHA}" || true
          } > release-notes.md

          gh release create "$tag" dist/*.apk \
            --title "Build ${BUILD_NUMBER} (v${VERSION})" \
            --notes-file release-notes.md

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ env.BUILD_NUMBER }}
          path: dist/*.apk
          retention-days: 30
