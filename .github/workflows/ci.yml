name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The format logic is Android-free by design, so it runs first and fails
      # fast without needing the SDK.
      - name: Unit tests (core)
        run: ./gradlew :core:test

      - name: Build the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug

      # Lets a change be installed and tried before it is merged, not only
      # after. Merges to master publish a GitHub release instead — see
      # release.yml.
      - name: Upload the APK for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-pr-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/build/reports/tests/test
